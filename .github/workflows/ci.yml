name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Tests and packaging check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The addon targets WoW's Lua 5.1; 5.4 runs the suite fine and is what is
      # packaged for Ubuntu. Keep the addon code 5.1-compatible regardless.
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4 zip

      - name: Syntax-check every file
        run: |
          fail=0
          for f in $(find Eloquence Tests -name '*.lua'); do
            luac5.4 -p "$f" || { echo "::error file=$f::does not parse"; fail=1; }
          done
          exit $fail

      - name: Run the test suite
        run: lua5.4 Tests/run.lua

      # Also proves the TOC matches what is on disk, so a forgotten TOC entry
      # cannot reach a release.
      - name: Build the release zip
        run: ./tools/package.sh

      - name: Upload the zip as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eloquence-zip
          path: dist/*.zip
          if-no-files-found: error
