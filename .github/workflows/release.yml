name: Release

# Tag a commit to cut a release:
#   git tag v2.0.0 && git push origin v2.0.0
#
# Builds the zip and attaches it to a GitHub Release. The CurseForge step runs
# only once credentials exist, so this is useful immediately with no setup:
#
#   CF_API_KEY     repository *secret*   -- CurseForge account settings, API Tokens
#   CF_PROJECT_ID  repository *variable* -- numeric Project ID on the project page

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    # Mapped to env here so the CurseForge step can be guarded with a plain
    # env check; the secrets context is not dependable inside a step `if`.
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4 zip

      # Never ship something the suite has not passed.
      - name: Run the test suite
        run: lua5.4 Tests/run.lua

      - name: Check the packaging helpers
        run: CF_SELFTEST=1 ./tools/curseforge-upload.sh

      - name: Build the release zip
        id: build
        run: |
          ./tools/package.sh
          version="$(sed -n 's/^## Version:[[:space:]]*//p' Eloquence/Eloquence.toc | tr -d '\r')"
          echo "zip=$(ls dist/*.zip | head -1)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "interface=$(sed -n 's/^## Interface:[[:space:]]*//p' Eloquence/Eloquence.toc | tr -d '\r')" >> "$GITHUB_OUTPUT"
          # On a tag push the tag names the release. Run manually and there is no
          # tag, so derive one from the TOC version -- which also means a manual
          # run can cut a release from an environment that cannot push tags.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
          VERSION: ${{ steps.build.outputs.version }}
          INTERFACE: ${{ steps.build.outputs.interface }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          tag="$TAG"
          # A manual run has no tag object yet; point one at this commit.
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null 2>&1 || true
          fi
          notes=$(cat <<EOF
          Eloquence $VERSION, built for interface $INTERFACE.

          Download the zip below and extract it into
          \`World of Warcraft/_retail_/Interface/AddOns/\`.
          You should end up with an \`AddOns/Eloquence/\` folder containing \`Eloquence.toc\`.
          EOF
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ZIP" --clobber
          else
            gh release create "$tag" "$ZIP" --title "Eloquence $VERSION" --notes "$notes"
          fi

      - name: Upload to CurseForge
        if: env.CF_API_KEY != '' && env.CF_PROJECT_ID != ''
        env:
          CF_CHANGELOG: "Release ${{ github.ref_name }}. See the GitHub release for details."
        run: ./tools/curseforge-upload.sh "${{ steps.build.outputs.zip }}"

      - name: Note when CurseForge was skipped
        if: env.CF_API_KEY == '' || env.CF_PROJECT_ID == ''
        run: |
          echo "::notice::CurseForge upload skipped -- set the CF_API_KEY secret and the CF_PROJECT_ID variable to enable it."
